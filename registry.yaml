# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: github_archive
    repo_owner: KnickKnackLabs
    repo_name: bats-core
    description: KnickKnackLabs-maintained Bash Automated Testing System
    supported_envs:
      - darwin
      - linux
    files:
      - name: bats
        src: bats-core-{{trimV .Version}}/bin/bats
